name: ci

on:
  push:
    branches: [ main ]
  pull_request:

# Токен раннера — только на чтение репозитория (ни один шаг не пишет в GitHub).
permissions:
  contents: read

jobs:
  # ── Статический анализ всех скриптов ────────────────────────────────────────
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      # SHA-пин: плавающий тег v4 может быть перенесён на другой коммит
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - name: Gate (severity=error — блокирует merge)
        run: shellcheck -x --severity=error install.sh scripts/*.sh scripts/lib/*.sh tests/*.sh
      - name: Report (severity=style — информационно, не блокирует)
        continue-on-error: true
        run: shellcheck -x --severity=style install.sh scripts/*.sh scripts/lib/*.sh
      - name: apply-path smoke (set -u — полный apply protect.sh через стабы)
        # Ловит unbound-vars в ветках, исполняемых только при реальном применении
        # (модули fleet/blocklists/ctguard, маркер, save_conf) — их не видит DRY_RUN/bash -n.
        run: bash tests/apply-smoke.sh
      - name: fleet-sync unit (ИСПОЛНЯЕТ сгенерированный хелпер против стабов)
        # Секреты не в argv, уходят через -H @file, URL в логе без userinfo,
        # редиректы при токене заблокированы, fail-safe last-known-good работает.
        run: bash tests/fleet-sync-unit.sh
      - name: ctguard unit (ИСПОЛНЯЕТ сгенерированный хелпер против стабов)
        # Свой адрес и приватные диапазоны не попадают в кандидаты на эвикт, а
        # v4-mapped пиры (`[::ffff:…]` от ss) находятся в live-lookup: обе ошибки
        # молча ломали ctguard и рвали пользовательские сессии (issue #22).
        run: bash tests/ctguard-unit.sh
      - name: logrotate unit (ИСПОЛНЯЕТ секцию ротации optimize.sh против стабов)
        # Ре-ран не падает на backup_file без 2-го аргумента (#24), конфликт масок
        # решает вердикт самого logrotate, а не сравнение строк (#25), и глобы
        # NA_LOG_PATHS не раскрываются шеллом в явные пути.
        run: bash tests/logrotate-unit.sh
      - name: common unit (счёт nft-сетов, json_escape, tty_tput, дрейф дефолтов conf)
        # nft_set_count считает адреса, а не строки с 'timeout' (#32); json_escape не даёт
        # переводу строки сломать --json (#27); tput молчит не в терминале (#28); conf
        # с замороженным старым дефолтом → warn / NA_ADOPT_NEW_DEFAULTS=1 / маркер explicit (#34).
        run: bash tests/common-unit.sh
      - name: rps unit (ИСПОЛНЯЕТ сгенерированный na-rps-setup против стабов ip/nproc/sysfs)
        # Юнит рапортовал success при неприменённом RPS: default route на буте появляется
        # позже network-online.target, скрипт молча выходил нулём (#30). Теперь NIC из
        # ExecStart, ожидание маршрута, фолбэк на физические, честный отказ; плюс #28 —
        # в перенаправленном stdout нет escape-кодов курсора. v4.2: без RPS на 1 vCPU и
        # при RX-очередей ≥ ядер, XPS только с NA_XPS=1, маски из снимка, venet0.
        run: bash tests/rps-unit.sh
      - name: psi unit (секция PSI optimize.sh + откат против стаба update-grub)
        # ENABLE_PSI=1 дописывает psi=1 в GRUB_CMDLINE_LINUX_DEFAULT идемпотентно, =0 не
        # трогает файл, rollback снимает ТОЛЬКО свой psi=1 (маркер) (#37).
        run: bash tests/psi-unit.sh
      - name: protect unit (na-fw-status / add_wl / сборка PORTSCAN / бюджет журнала против стабов)
        # Счётчики na-fw-status считают адреса (#32); дубли и широкие CIDR в WHITELIST
        # замечаются, /32 нормализуется, дедуп доезжает до nft/CrowdSec-yaml (#38);
        # PORTSCAN_LOG_RATE=0 снимает лог, не бан; бюджет журнала считается (#35).
        run: bash tests/protect-unit.sh
      - name: diagnose unit (ИСПОЛНЯЕТ обе ветки diagnose против стабов docker/nft/ss/cscli/journalctl)
        # --json валиден на хосте без контейнера node-агента (#27); счётчики autoban/suspect
        # считают адреса (#32); датчик CONN_LIMIT без loopback/whitelist (#31); дрейф
        # whitelist относительно protect.conf (#38); PSI три состояния (#37); серты в
        # /opt/*/certs и снятые с renew (#39); глубина журнала (#35); RPS-юнит vs факт (#30).
        # v4.2: дельты счётчиков между запусками, steal окном 3 с, PSI avg60, ложные ▲ по
        # аудиту флота, порты из живых правил, CrowdSec по источникам, allowlist CrowdSec,
        # DNAT мимо na_filter, слушатели вне файрвола, просроченный серт, Caddy/nginx.
        run: bash tests/diagnose-unit.sh
      - name: optimize unit (секции sysctl/journald/снимки/проверки XanMod + откат runtime против стабов)
        # v4.2: чужой sysctl.d, перебивающий наш ключ, назван по имени; порты xray внутри
        # эфемерного диапазона (вкл. 127.0.0.1:10085) резервируются без потери резерва
        # оператора; без net.ipv6.conf.all.forwarding; journald 10-na-size.conf +
        # persistent при volatile; откат возвращает sysctl/RPS/XPS/THP без ребута; Secure
        # Boot и тесный /boot — без ядра, initrd и драйвер NIC — до «нужна перезагрузка»;
        # default_iface после `dev` (venet0/multipath); apt ждёт чужой dpkg-лок.
        run: bash tests/optimize-unit.sh
      - name: na-report unit (CrowdSec по строкам raw, честные метрики 5 мин, asn_enrichment)
        # v4.2: решения считались по полям "value" в -o json (×33 на ноде флота);
        # ban_rate_5m был числом строк лога — рядом events_5m/unique_src_5m; флаг
        # ok|partial|unavailable для ASN; управляющий символ из whois не ломает JSON.
        run: bash tests/na-report-unit.sh
      - name: lint — никаких `cmd | grep -q` под pipefail (SIGPIPE → ложное «нет»)
        # grep -q закрывает пайп на первом совпадении; дописывающая команда ловит SIGPIPE,
        # пайплайн под pipefail отдаёт 141. В v4.1.2 так через раз гас сенсор лога
        # анти-скана, никогда не срабатывал cubic-warn и не виден был дубль logrotate.
        run: bash tests/lint-pipefail.sh
      - name: Install minisign (install unit — подписи локальных модулей)
        run: sudo apt-get install -y -qq minisign || echo "minisign недоступен — секция подписей в install-unit пропустится"
      - name: install unit (curl|bash НЕ исполняет scripts/ из текущей папки)
        # До v4.1.3 SCRIPT_DIR брался из $0 = "bash" → текущая папка: подложенный scripts/
        # исполнялся root'ом мимо скачивания по NA_REF и проверки подписей.
        run: bash tests/install-unit.sh
      - name: na-report читает журнал всех загрузок (-b all), не только текущей (#41)
        # `-k` подразумевает `-b`: после ребута отчёт «за 24ч» молча становился «с момента
        # загрузки» (×31 занижение на ноде флота). Оба вызова journalctl -k — с -b all.
        run: |
          N="$(grep -cE 'journalctl -k -b all --since' scripts/na-report.sh)"
          [ "$N" -ge 2 ] || { echo "в na-report.sh journalctl -k без -b all (найдено $N из 2)"; exit 1; }
          if grep -nE 'journalctl -k( |$)' scripts/na-report.sh | grep -vq -- '-b all'; then
            echo "остался journalctl -k без -b all:"; grep -nE 'journalctl -k( |$)' scripts/na-report.sh | grep -v -- '-b all'; exit 1
          fi
          bash scripts/na-report.sh --json | grep -q '"journal_span_h":' || { echo "na-report --json без journal_span_h"; exit 1; }
          echo "ok: -b all в обоих вызовах, journal_span_h в json"

  # ── Поведение лимитеров на НАСТОЯЩЕМ nft (netns + veth, root) ────────────────
  # Текст ruleset проверяют юнит-тесты; здесь — что полный набор не режет новых клиентов,
  # записи истекают, а сам лимит работает (v4.1.3: meter без timeout копил адреса до
  # ребута и на 65535 записях отсекал каждого нового клиента).
  nft-behavior:
    runs-on: ubuntu-latest
    steps:
      # SHA-пин: плавающий тег v4 может быть перенесён на другой коммит
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Install nftables
        run: sudo apt-get update -qq && sudo apt-get install -y -qq nftables iproute2 python3
      - name: real nft in netns (timeout у наборов, fail-open на полном наборе, rate-limit)
        run: sudo bash tests/nft-behavior.sh
      - name: правило CROWDSEC_SCOPE=ssh на настоящем nft (auto-merge, правка как в na-fw, ре-загрузка)
        run: sudo bash tests/cs-scope-nft.sh

  # ── CROWDSEC_SCOPE на НАСТОЯЩЕМ crowdsec-firewall-bouncer ───────────────────
  # Блокер ревью v4.2: restart bouncer'а после наших таблиц — старый процесс на выходе
  # удалял таблицу, новый в set-only не стартовал, и CrowdSec не блокировал ничего. Юнит
  # подменяет systemctl/nft; здесь bouncer настоящий (репо packagecloud, как в protect.sh).
  crowdsec-e2e:
    runs-on: ubuntu-latest
    steps:
      # SHA-пин: плавающий тег v4 может быть перенесён на другой коммит
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Install CrowdSec + nftables bouncer (packagecloud any/any, ключ — в keyring)
        run: |
          curl -fsSL https://packagecloud.io/crowdsec/crowdsec/gpgkey | sudo gpg --dearmor -o /usr/share/keyrings/crowdsec.gpg
          echo "deb [signed-by=/usr/share/keyrings/crowdsec.gpg] https://packagecloud.io/crowdsec/crowdsec/any any main" \
            | sudo tee /etc/apt/sources.list.d/crowdsec.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq nftables crowdsec crowdsec-firewall-bouncer-nftables
      - name: Bouncer зарегистрирован в LAPI и запущен
        # postinst регистрирует bouncer и запускает его, только если LAPI уже отвечал; на
        # раннере crowdsec поднимается позже — регистрируем сами (ключ локальный, одноразовый)
        run: |
          Y=/etc/crowdsec/bouncers/crowdsec-firewall-bouncer.yaml
          sudo systemctl start crowdsec
          for i in $(seq 60); do sudo cscli lapi status >/dev/null 2>&1 && break; sleep 1; done
          sudo cscli lapi status
          if ! sudo grep -qE '^api_key:[[:space:]]*[A-Za-z0-9]' "$Y"; then
            KEY="$(sudo cscli bouncers add "na-ci-$(date +%s)" -o raw)"
            sudo sed -i -E "s|^api_key:.*|api_key: ${KEY}|" "$Y"
          fi
          sudo systemctl enable --now crowdsec-firewall-bouncer
          sleep 3; systemctl is-active crowdsec-firewall-bouncer \
            || { sudo journalctl -u crowdsec-firewall-bouncer -n 30 --no-pager; exit 1; }
      - name: ssh ↔ all на настоящем bouncer'е (не падает, решения доезжают)
        run: sudo bash tests/crowdsec-e2e.sh

  # ── Smoke-тесты на матрице дистрибутивов ────────────────────────────────────
  # Ловит ровно тот класс регрессий, из-за которых появился этот PR: установка
  # XanMod на разных Ubuntu/Debian и генерация nftables-ruleset.
  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          # focal: самый старый nft из заявленных (0.9.3). Debian 11 (nft 0.9.8) вне LTS: в
          # образе пакеты из debian-security, а пул security без файлов из индексов (404, и
          # в snapshot тоже) — apt не ставит даже git; синтаксис покрывает focal.
          - "ubuntu:20.04"
          - "debian:bookworm"
          - "debian:trixie"
          - "ubuntu:22.04"   # jammy → подменяется на bookworm
          - "ubuntu:24.04"   # noble
          - "ubuntu:26.04"   # свежий LTS: XanMod/CrowdSec-suite резолвятся через фоллбэки
    container:
      image: ${{ matrix.image }}
      # protect.sh DRY_RUN вызывает 'nft -c', который валидирует ruleset через netlink
      # к netfilter ядра — без CAP_NET_ADMIN это «Operation not permitted». --privileged
      # даёт те же права, что есть у скрипта на реальной ноде под root.
      options: --privileged
    steps:
      - name: Install git (нужен checkout) + базовые сертификаты
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends git ca-certificates
      # SHA-пин: плавающий тег v4 может быть перенесён на другой коммит
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Prep container + runtime-зависимости
        run: |
          # Запрещаем запуск сервисов из postinst (в контейнере нет systemd как PID1)
          printf '#!/bin/sh\nexit 101\n' > /usr/sbin/policy-rc.d && chmod +x /usr/sbin/policy-rc.d
          apt-get install -y -qq --no-install-recommends \
            bash curl gnupg nftables iproute2 gawk procps kmod coreutils irqbalance ethtool jq
      - name: Syntax (bash -n)
        run: bash -n install.sh scripts/*.sh scripts/lib/*.sh
      - name: правило CROWDSEC_SCOPE=ssh грузится nft этой ОС (whitelist с auto-merge)
        run: bash tests/cs-scope-nft.sh
      - name: protect.sh DRY_RUN (дефолты — генерация + nft -c)
        run: DRY_RUN=1 REMNAWAVE_NONINTERACTIVE=1 bash scripts/protect.sh
      - name: protect.sh DRY_RUN (full-feature — blocklists/fleet/whitelist-only/ban-once → nft -c)
        run: |
          DRY_RUN=1 REMNAWAVE_NONINTERACTIVE=1 \
            ENABLE_BLOCKLISTS=1 BLOCK_TOR=1 ENABLE_BANONCE=1 \
            FLEET_SYNC=1 REMNAWAVE_URL=https://panel.example.com REMNAWAVE_TOKEN=ci-token \
            WHITELIST="1.2.3.4,2001:db8::1" NODE_PORT_WHITELIST_ONLY=1 \
            bash scripts/protect.sh
      - name: protect.sh — отказ на кривом ENV (валидация)
        run: |
          if SYN_RATE='x; rm' DRY_RUN=1 REMNAWAVE_NONINTERACTIVE=1 bash scripts/protect.sh 2>/dev/null; then
            echo "валидация НЕ сработала на кривом SYN_RATE"; exit 1
          else echo "ok: кривой ENV отвергнут"; fi
      - name: protect.sh DRY_RUN (FW_MODE=open — 3x-ui-режим, policy accept → nft -c)
        run: DRY_RUN=1 REMNAWAVE_NONINTERACTIVE=1 FW_MODE=open bash scripts/protect.sh
      - name: protect.sh DRY_RUN (FW_MODE=skip — файрвол пропущен, инструкция напечатана)
        run: |
          OUT="$(DRY_RUN=1 REMNAWAVE_NONINTERACTIVE=1 FW_MODE=skip bash scripts/protect.sh)"
          echo "$OUT" | grep -q 'Как закрыть порты самому' || { echo "skip: инструкция по ручной блокировке не напечатана"; exit 1; }
      - name: protect.sh — отказ на кривом FW_MODE
        run: |
          if FW_MODE=firewall DRY_RUN=1 REMNAWAVE_NONINTERACTIVE=1 bash scripts/protect.sh 2>/dev/null; then
            echo "валидация НЕ сработала на кривом FW_MODE"; exit 1
          else echo "ok: кривой FW_MODE отвергнут"; fi
      - name: protect.sh DRY_RUN (NODE_PORT=auto — детект порта node-агента из .env → nft -c)
        run: |
          # NODE_PORT_PEERS прогоняет na_nodeport_wl_* С ЭЛЕМЕНТАМИ (v4+v6) через настоящий nft -c
          mkdir -p /opt/remnanode && printf 'NODE_PORT=3000\n' > /opt/remnanode/.env
          OUT="$(DRY_RUN=1 REMNAWAVE_NONINTERACTIVE=1 WHITELIST=203.0.113.7 \
                 NODE_PORT_PEERS='198.51.100.7,2001:db8::99' bash scripts/protect.sh)"
          echo "$OUT" | grep -q 'автодетект порта → 3000' || { echo "детект NODE_PORT из /opt/remnanode/.env не сработал"; exit 1; }
          echo "$OUT" | grep -q 'авто-допуск established-пиров' || { echo "авто-допуск пиров node-порта не сработал"; exit 1; }
          rm -rf /opt/remnanode
      - name: protect.sh DRY_RUN (NODE_PORT списком) + отказ на кривом NODE_PORT
        run: |
          DRY_RUN=1 REMNAWAVE_NONINTERACTIVE=1 NODE_PORT=2222,3000 bash scripts/protect.sh
          if NODE_PORT=abc DRY_RUN=1 REMNAWAVE_NONINTERACTIVE=1 bash scripts/protect.sh 2>/dev/null; then
            echo "валидация НЕ сработала на кривом NODE_PORT"; exit 1
          else echo "ok: кривой NODE_PORT отвергнут"; fi
      - name: protect.sh DRY_RUN (порт текущей SSH-сессии не теряется → nft -c)
        run: |
          # SSH_CONNECTION = "<c-ip> <c-port> <s-ip> <s-port>": порт сессии — ground truth.
          # Ошибка детекта/протухший protect.conf не должны отрезать текущий доступ.
          OUT="$(SSH_CONNECTION='203.0.113.9 55000 10.0.0.5 56777' SSH_PORT=22 \
                 DRY_RUN=1 REMNAWAVE_NONINTERACTIVE=1 bash scripts/protect.sh)"
          echo "$OUT" | grep -q 'SSH-сессия пришла на :56777' || { echo "порт SSH-сессии не подхвачен"; exit 1; }
          # в DRY_RUN ruleset генерится во временный файл (/tmp/na_filter.XXXXXX.nft),
          # а не в $CONF_DIR — берём самый свежий
          F="$(ls -t /tmp/na_filter.*.nft 2>/dev/null | head -1)"
          [ -n "$F" ] || { echo "не найден сгенерированный ruleset"; exit 1; }
          grep -q 'tcp dport { 22, 56777 }' "$F" || { echo "в ruleset ($F) нет обоих SSH-портов"; exit 1; }
          echo "ok: порт сессии добавлен в ruleset ($F)"
      - name: diagnose.sh (read-only, не должен падать жёстко)
        run: bash scripts/diagnose.sh || true
      - name: diagnose.sh --json (machine-readable smoke)
        run: bash scripts/diagnose.sh --json || true
      - name: diagnose.sh --retrans (deep-dive smoke, короткое окно)
        run: bash scripts/diagnose.sh --retrans --window 5 || true
      - name: na-report smoke (--json / --ip / --port)
        run: |
          bash scripts/na-report.sh --json | grep -q '"drops_by_reason"' || { echo "na-report --json без drops_by_reason"; exit 1; }
          L="$(bash scripts/na-report.sh --json | wc -l)"; [ "$L" -eq 1 ] || { echo "na-report --json должен быть ОДНОЙ строкой (битый JSON), получено: $L"; exit 1; }
          bash scripts/na-report.sh --ip 127.0.0.1 >/dev/null 2>&1 || true
          bash scripts/na-report.sh --port 443 >/dev/null 2>&1 || true
          echo "ok: na-report --json/--ip/--port отработали"
      - name: JSON-валидность (jq) + na_version + --proxyware одна строка
        run: |
          bash scripts/diagnose.sh --json | jq -e . >/dev/null || { echo "diagnose --json не парсится jq"; exit 1; }
          bash scripts/diagnose.sh --json | grep -q '"na_version":"' || { echo "diagnose --json без na_version"; exit 1; }
          bash scripts/na-report.sh --json | jq -e . >/dev/null || { echo "na-report --json не парсится jq"; exit 1; }
          P="$(bash scripts/na-report.sh --proxyware --json)"
          [ "$(printf '%s\n' "$P" | wc -l)" -eq 1 ] || { echo "--proxyware --json должен быть ОДНОЙ строкой"; exit 1; }
          printf '%s' "$P" | jq -e . >/dev/null || { echo "--proxyware --json не парсится jq"; exit 1; }
          echo "ok: все --json валидны, na_version присутствует"
      - name: protect.sh DRY_RUN (fleet-sync через REMNAWAVE_NODES_URL, без токена)
        run: |
          DRY_RUN=1 REMNAWAVE_NONINTERACTIVE=1 FLEET_SYNC=1 \
            REMNAWAVE_NODES_URL=https://panel.example.com/fleet/nodes.json \
            bash scripts/protect.sh
      - name: protect.sh DRY_RUN (PORTSCAN_LOG_RATE=0 — лог анти-скана не ставится, бан остаётся)
        run: |
          DRY_RUN=1 REMNAWAVE_NONINTERACTIVE=1 PORTSCAN_LOG_RATE=0 bash scripts/protect.sh
          F="$(ls -t /tmp/na_filter.*.nft | head -1)"
          grep -q '\[na portscan\]' "$F" && { echo "лог анти-скана не должен ставиться при PORTSCAN_LOG_RATE=0"; exit 1; }
          grep -q 'add @autoban_v4' "$F" || { echo "бан за скан пропал вместе с логом"; exit 1; }
          echo "ok: лог снят, бан на месте"
      - name: protect.sh DRY_RUN (дефолтный рейт лога анти-скана → nft -c) + отказ на кривом PORTSCAN_LOG_RATE
        run: |
          DRY_RUN=1 REMNAWAVE_NONINTERACTIVE=1 bash scripts/protect.sh
          F="$(ls -t /tmp/na_filter.*.nft | head -1)"
          grep -q 'limit rate 60/minute burst 30 packets log prefix "\[na portscan\] "' "$F" || { echo "лог анти-скана не на 60/minute burst 30"; exit 1; }
          if PORTSCAN_LOG_RATE=abc DRY_RUN=1 REMNAWAVE_NONINTERACTIVE=1 bash scripts/protect.sh 2>/dev/null; then
            echo "валидация НЕ сработала на кривом PORTSCAN_LOG_RATE"; exit 1
          else echo "ok: кривой PORTSCAN_LOG_RATE отвергнут"; fi
      - name: protect.sh DRY_RUN (дубль и широкий CIDR в WHITELIST → warn, в ruleset один адрес)
        run: |
          OUT="$(DRY_RUN=1 REMNAWAVE_NONINTERACTIVE=1 \
                 WHITELIST='203.0.113.7,203.0.113.7,203.0.113.0/24' bash scripts/protect.sh)"
          echo "$OUT" | grep -q 'указан дважды' || { echo "дубль в WHITELIST не замечен"; exit 1; }
          echo "$OUT" | grep -q 'ПОЛНЫЙ обход защиты' || { echo "широкий CIDR не замечен"; exit 1; }
          F="$(ls -t /tmp/na_filter.*.nft | head -1)"
          [ "$(grep -o '203\.0\.113\.7' "$F" | wc -l)" -eq 1 ] || { echo "дубль уехал в ruleset"; exit 1; }
          echo "ok: дедуп + warn о широком CIDR"
      - name: "protect.sh DRY_RUN — замороженный дефолт в protect.conf (#34): warn, adopt, explicit"
        run: |
          mkdir -p /etc/node-accelerator
          printf '# node-accelerator — сохранённый конфиг ноды @ 2026-07-11\n: "${CROWDSEC_STRICT:=0}"\n' > /etc/node-accelerator/protect.conf
          OUT="$(DRY_RUN=1 REMNAWAVE_NONINTERACTIVE=1 bash scripts/protect.sh)"
          echo "$OUT" | grep -q 'CROWDSEC_STRICT=0 записан старой версией' || { echo "нет warn о замороженном дефолте"; exit 1; }
          OUT="$(DRY_RUN=1 REMNAWAVE_NONINTERACTIVE=1 NA_ADOPT_NEW_DEFAULTS=1 bash scripts/protect.sh)"
          echo "$OUT" | grep -q 'CROWDSEC_STRICT=0 → 1 — принят дефолт' || { echo "NA_ADOPT_NEW_DEFAULTS=1 не принял дефолт"; exit 1; }
          OUT="$(DRY_RUN=1 REMNAWAVE_NONINTERACTIVE=1 CROWDSEC_STRICT=0 bash scripts/protect.sh)"
          echo "$OUT" | grep -q 'записан старой версией' && { echo "warn при явном ENV — лишний"; exit 1; }
          rm -f /etc/node-accelerator/protect.conf
          echo "ok: дрейф дефолтов conf — warn / adopt / explicit"
      - name: CrowdSec-репозиторий резолвится (CROWDSEC_PROBE, без установки)
        run: CROWDSEC_PROBE=1 REMNAWAVE_NONINTERACTIVE=1 bash scripts/protect.sh
      - name: install.sh persist → CLI na-diagnose + na-report создаются и отдают JSON
        run: |
          bash install.sh persist
          test -x /usr/local/sbin/na-diagnose || { echo "na-diagnose не создан"; exit 1; }
          test -x /usr/local/sbin/na-report   || { echo "na-report не создан"; exit 1; }
          /usr/local/sbin/na-diagnose --json | grep -q '"firewall"' || { echo "na-diagnose --json не отдал JSON"; exit 1; }
          /usr/local/sbin/na-report --json | grep -q '"drops_by_reason"' || { echo "na-report --json не отдал JSON"; exit 1; }
          echo "ok: na-diagnose + na-report установлены и отдают JSON"
      - name: DRY_RUN persist — без побочных эффектов
        run: |
          rm -f /usr/local/sbin/na-diagnose
          DRY_RUN=1 bash install.sh persist
          test ! -e /usr/local/sbin/na-diagnose || { echo "DRY_RUN всё равно создал CLI"; exit 1; }
          echo "ok: DRY_RUN ничего не пишет"
      - name: rollback снимает CLI, когда модулей не осталось
        run: |
          bash install.sh persist
          bash install.sh rollback all
          test ! -e /usr/local/sbin/na-diagnose || { echo "na-diagnose не снят rollback'ом"; exit 1; }
          test ! -e /usr/local/sbin/na-report   || { echo "na-report не снят rollback'ом"; exit 1; }
          echo "ok: rollback убрал CLI"
      - name: XanMod репозиторий+ключ+кандидат резолвятся (без установки ядра)
        run: XANMOD_PROBE=1 ENABLE_XANMOD=1 bash scripts/optimize.sh
